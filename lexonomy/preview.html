<!DOCTYPE html>
<!--
  Dev-only standalone harness for custom_editor.js. NOT part of the Lexonomy
  upload. It loads the editor exactly the way the fork does
  (`new Function("return " + src)()`, see nvh-store.js:150) and mounts it against
  a sample NVH entry, with a live NVH dump of getValue() so you can watch
  overrides round-trip.

  The flexion table comes from the real generator service, so run it first
  (`make flexsrv`, default 127.0.0.1:8080; override with ?flex=URL below).
  Then serve this dir and open the file:
      python3 -m http.server -d fst/lexonomy 8777   ->  http://localhost:8777/preview.html

  A row of sample entries (noun/adj/verb, different paradigms) sits under the
  header; pick one to re-mount the editor on it.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Prussian custom editor — preview (live generator)</title>
<link rel="stylesheet" href="custom_editor.css">
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; color: #222; }
  header { background: #2f3b45; color: #fff; padding: 10px 18px; }
  header b { font-weight: 600; }
  header .tag { background: #b4690e; border-radius: 8px; padding: 1px 8px; font-size: 11px; margin-left: 8px; }
  .cols { display: flex; gap: 0; align-items: stretch; }
  .pane { flex: 1; padding: 18px; }
  .pane.right { background: #f6f7f8; border-left: 1px solid #e2e4e6; max-width: 420px; }
  .pane.right h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #667; }
  pre { background: #fff; border: 1px solid #e2e4e6; border-radius: 6px; padding: 10px; white-space: pre-wrap; font-size: 12px; }
  #log { color: #557; font-size: 12px; }
</style>
</head>
<body>
<header>
  <b>Prussian custom entry editor</b> — standalone preview
  <span class="tag" id="fxtag">…</span>
  <span style="margin-left:12px;font-size:12px;opacity:.8">
    Flexion service: <input id="fxurl" size="26"
      style="font:12px/1.4 monospace;padding:1px 4px"> <span id="fxhealth"></span>
  </span>
  <div id="samples" style="margin-top:8px;font-size:12px;opacity:.9"></div>
</header>
<div class="cols">
  <div class="pane">
    <div id="editor"></div>
  </div>
  <div class="pane right">
    <h4>getValue() → NVH (live)</h4>
    <pre id="nvh"></pre>
    <h4>Events</h4>
    <div id="log"></div>
  </div>
</div>

<script>
// Serialize the getValue() JSON tree back to NVH for display (mirrors
// nvh-store.jsonToNvh's indentation, using bare names).
function toNvh(node, indent) {
  indent = indent || 0;
  var pad = "  ".repeat(indent);
  var line = pad + node.name + ": " + (node.value == null ? "" : node.value);
  (node.children || []).forEach(function (c) { line += "\n" + toNvh(c, indent + 1); });
  return line;
}

// NVH sample in the real schema (corpus/parsed/twanksta_dmlex.nvh): bare `pos`,
// separate top-level `gender`, top-level `paradigm`. `stemOverrides: role=stem`
// (Stufe 1) and `override`/`slot` under the sense (Stufe 2) are the nodes this
// editor introduces.
function sampleEntry(headword, pos, gender, paradigm, desc, examples, overrides, stems) {
  var kids = [
    { name: "id",    value: headword + "|" + paradigm + "|" + desc, path: "entry.id",    children: [] },
    { name: "pos",   value: pos,                                    path: "entry.pos",   children: [] },
  ];
  if (gender) kids.push({ name: "gender", value: gender, path: "entry.gender", children: [] });
  kids.push({ name: "paradigm", value: paradigm, path: "entry.paradigm", children: [] });
  kids.push({ name: "label", value: "MK", path: "entry.label", children: [] });
  var stemPairs = Object.keys(stems || {});
  if (stemPairs.length) {
    kids.push({ name: "stemOverrides", value: stemPairs.map(function (r) {
      return r + "=" + stems[r];
    }).join(" "), path: "entry.stemOverrides", children: [] });
  }
  var senseKids = [
    { name: "en", value: "—", path: "entry.sense.en", children: [] },
    { name: "de", value: "—", path: "entry.sense.de", children: [] },
  ];
  (examples || []).forEach(function (ex) {
    senseKids.push({ name: "example", value: ex.form, path: "entry.sense.example", children: [
      { name: "sourceIdentity",   value: "27(9)",           path: "entry.sense.example.sourceIdentity",   children: [] },
      { name: "sourceElaboration",value: "grammar: " + ex.slot, path: "entry.sense.example.sourceElaboration", children: [] },
      { name: "label",            value: "attested",        path: "entry.sense.example.label",            children: [] }
    ] });
  });
  Object.keys(overrides || {}).forEach(function (slot) {
    senseKids.push({ name: "override", value: overrides[slot], path: "entry.sense.override", children: [
      { name: "slot", value: slot, path: "entry.sense.override.slot", children: [] }
    ] });
  });
  kids.push({ name: "sense", value: "", path: "entry.sense", children: senseKids });
  kids.push({ name: "legacy", value: "", path: "entry.legacy", children: [
    { name: "desc", value: desc, path: "entry.legacy.desc", children: [] }
  ] });
  return { name: "entry", value: headword, path: "entry", children: kids };
}

// One entry per interesting generator path: declension, mobile adjective
// (three degrees + adverb), plain verb table, verb 87 variant; plus the Stufe-1
// corrections (gemination, thematic vowels, ablaut) and an unknown paradigm.
var SAMPLES = [
  {label: "Dēiws (noun P36, +1 Override)", make: function () {
    return sampleEntry("Dēiws", "noun", "masc", "36", "[Deiws 37]",
      [{form: "dēiwan", slot: "acc sg"}], { "sg.dat": "deiwu" }, {});
  }},
  {label: "dumslē (noun P53, ī-stem)", make: function () {
    return sampleEntry("dumslē", "noun", "neut", "53", "[dumslē]", [], {}, {});
  }},
  {label: "Patals (noun P32, stem obl=Patall)", make: function () {
    return sampleEntry("Patals", "noun", "masc", "32", "[Patals]",
      [{form: "Patallas", slot: "gen sg"}], {}, { obl: "Patall" });
  }},
  {label: "wilnis (adj P27, jo-stem, cmp/sup/adv)", make: function () {
    return sampleEntry("wilnis", "adj", "", "27", "[wilnis]", [], {}, {});
  }},
  {label: "auktums (adj P25, stem pos=auktumm)", make: function () {
    return sampleEntry("auktums", "adj", "", "25", "[auktums]",
      [{form: "auktummas", slot: "gen sg"}], {}, { pos: "auktumm" });
  }},
  {label: "appautwei (verb P85, Partizipien)", make: function () {
    return sampleEntry("appautwei", "verb", "", "85", "[appautwei]",
      [{form: "appauts", slot: "nom sg m"}], {}, {});
  }},
  {label: "rusītwei (verb P134, stem pres=rusē)", make: function () {
    return sampleEntry("rusītwei", "verb", "", "134", "[rusītwei]",
      [{form: "rusēi", slot: "prs 3sg"}], {}, { pres: "rusē" });
  }},
  {label: "kalbītwei (verb P136, pret=kalbē, partPresAct=kalbant)", make: function () {
    return sampleEntry("kalbītwei", "verb", "", "136", "[kalbītwei]",
      [{form: "kalbēi", slot: "prt 3sg"}, {form: "kalbants", slot: "ptcp prs nom sg m"}],
      {}, { pret: "kalbē", partPresAct: "kalbant" });
  }},
  {label: "kandtwei (verb P87 → 87a)", make: function () {
    return sampleEntry("kandtwei", "verb", "", "87", "[kandtwei]", [], {}, {});
  }},
  {label: "quatsch (noun P99 → unknown)", make: function () {
    return sampleEntry("quatsch", "noun", "neut", "99", "[quatsch]", [], {}, {});
  }},
];

var logEl = document.getElementById("log");
function log(msg) {
  var t = new Date().toLocaleTimeString();
  logEl.innerHTML = "<div>" + t + " — " + msg + "</div>" + logEl.innerHTML;
}

// The editor reads window.PFX_FLEX_URL; the harness sets it before loading so
// one preview page can point at any service instance.
var qs = new URLSearchParams(location.search);
var flexUrl = qs.get("flex") || "http://127.0.0.1:8080";
window.PFX_FLEX_URL = flexUrl;
document.getElementById("fxurl").value = flexUrl;
function reload() { location.search = "?flex=" + encodeURIComponent(flexUrl); }
document.getElementById("fxurl").addEventListener("change", function (e) {
  flexUrl = e.target.value.trim(); reload();
});
fetch(flexUrl + "/health").then(function (r) { return r.json(); }).then(function (h) {
  document.getElementById("fxhealth").textContent = h.ok
    ? (h.atoms + " atoms ready")
    : (h.missing.length + "/" + h.atoms + " atoms missing — make atoms");
}).catch(function (e) { document.getElementById("fxhealth").textContent = "unreachable (" + e.message + ")"; });
document.getElementById("fxtag").textContent = "LIVE GENERATOR";

fetch("custom_editor.js")
  .then(function (r) { return r.text(); })
  .then(function (src) {
    // EXACTLY how Lexonomy loads it (nvh-store.js:150):
    var api = new Function("return " + src)();
    var dump = document.getElementById("nvh");
    var host = document.getElementById("editor");
    var sampleBar = document.getElementById("samples");

    SAMPLES.forEach(function (sample, i) {
      var b = document.createElement("button");
      b.textContent = sample.label;
      b.style.cssText = "margin-right:6px;cursor:pointer";
      b.addEventListener("click", function () { mount(sample.make(), b); });
      sampleBar.appendChild(b);
      if (i === 0) b.style.border = "1px solid #fff";
    });

    function refresh() { dump.textContent = toNvh(api.getValue()); }
    function mount(entry, btn) {
      host.innerHTML = "";
      api.editor({
        node: host,
        entry: entry,
        readOnly: false,
        onChange: function () { log("onChange"); refresh(); },
        onValidChange: function (v) { log("onValidChange(" + v + ")"); }
      });
      Array.prototype.forEach.call(sampleBar.children, function (c) { c.style.border = "none"; });
      if (btn) btn.style.border = "1px solid #fff";
      log("mounted " + entry.value + " (" + entry.children[1].value + ")");
      refresh();
    }
    mount(SAMPLES[0].make(), sampleBar.children[0]);
    setInterval(refresh, 600); // catch override edits (fired on input 'change')
  })
  .catch(function (e) { log("load failed: " + e.message); });
</script>
</body>
</html>
