name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hfst:
    # HFST-nativer Analysator (docs/HFST_BRANCH.md): lexd ∘ Regeln,
    # gegen den Goldstandard validiert. python-hfst hat kein cp313-Wheel,
    # daher Python 3.12.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Twanksta + Prusaspira entries
        run: |
          mkdir -p data/external
          REL=https://github.com/strfry/prussian-corpus/releases/download/v2026-06-21
          curl -fsSL "$REL/twanksta_entries.json"  -o data/external/twanksta_entries.json
          curl -fsSL "$REL/prusaspira_entries.json" -o data/external/prusaspira_entries.json

      - name: Install lexd + hfst CLI
        run: sudo apt-get update && sudo apt-get install -y lexd hfst

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-hfst
        run: python -m pip install hfst

      - name: Build + validate HFST analyser (Vollbau, Parität 1471/1471)
        run: |
          PYTHONPATH=src python -m prussian.fst.hfst.lexd_build
          PYTHONPATH=src python -m prussian.fst.hfst.check
