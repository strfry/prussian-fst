name: Build Dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout prussian-fst
        uses: actions/checkout@v4

      - name: Download external data files
        run: |
          RELEASE="https://github.com/strfry/prussian-corpus/releases/download/v2026-06-21"
          mkdir -p data/external
          curl -fsSL "$RELEASE/twanksta_entries.json"  -o data/external/twanksta_entries.json
          curl -fsSL "$RELEASE/prusaspira_entries.json" -o data/external/prusaspira_entries.json

      - name: Download Tatoeba corpus
        run: |
          mkdir -p corpus
          curl -fsSL https://downloads.tatoeba.org/exports/per_language/prg/prg_sentences.tsv.bz2 \
            | bunzip2 > corpus/prg_sentences.tsv

      - uses: actions/setup-python@v5
        with:
          python-version: 'pypy-3.10'

      - name: Install dependencies
        run: pypy3 -m pip install pyfoma pytest

      - name: Cache FST build artifacts
        uses: actions/cache@v4
        id: fst-cache
        with:
          path: build/
          key: fst-${{ hashFiles('src/**/*.py', 'data/gold/**', 'data/closed/**') }}

      - name: Build FST
        if: steps.fst-cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=src pypy3 -m prussian.fst.build

      - name: Run tests
        run: PYTHONPATH=src pypy3 -m pytest tests/ -v

  deploy:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout prussian-fst
        uses: actions/checkout@v4

      - name: Checkout prussian-mcp (Git LFS)
        uses: actions/checkout@v4
        with:
          repository: strfry/prussian-mcp
          lfs: true
          path: prussian-mcp

      - name: Copy external data files
        run: |
          mkdir -p data/external
          cp prussian-mcp/data/wordlist.json data/external/wordlist.json
          cp prussian-mcp/data/prussian_dictionary.json data/external/prussian_dictionary.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Restore FST cache
        uses: actions/cache@v4
        with:
          path: build/
          key: fst-${{ hashFiles('src/**/*.py', 'data/gold/**', 'data/closed/**') }}

      - name: Build FST (falls Cache miss)
        run: uv run python -m prussian.fst.build

      - name: Generate dashboard.json
        run: PYTHONPATH=src pypy3 -m prussian.report.dashboard

      - name: Commit dashboard.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/derived/dashboard.json dashboard/data.js
          git diff --staged --quiet || git commit -m "ci: regenerate dashboard.json [skip ci]"
          git push

      - name: Upload dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
