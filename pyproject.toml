[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prussian-fst"
version = "0.2.0"
description = "Old Prussian morphological analyzer and generator (HFST/lexd)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/strfry/prussian-fst"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
