[project]
name = "prussian-fst"
version = "0.3.0"
description = "Old Prussian morphological analyzer and generator (HFST/lexd)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "conllu>=6.0.0",
    "hfst>=3.16.0.1",
    "pyhfst>=1.4.0",
]

[project.urls]
Repository = "https://github.com/strfry/prussian-fst"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["prussian_fst"]

