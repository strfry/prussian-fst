<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prūsiskan · FST Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #e9ecf0; font-family: 'IBM Plex Sans', sans-serif; color: #11202e; -webkit-font-smoothing: antialiased; }
  ::selection { background: #1d4e74; color: #fff; }
</style>
<!-- Generierte Daten (prussian.report.dashboard schreibt data.js). Fehlt sie,
     greift die eingebaute Demo. Ein <script src> lädt auch unter file://. -->
<script src="./data.js" onerror="window.__noData=true"></script>
</head>
<body>
<div id="app" style="min-height: 100vh; padding: 40px 32px 56px;"></div>

<script>
"use strict";

function demoData() {
  return {
    meta: { generated: '—', fst: { analyser_states: 0, lenient_states: 0, build_commit: '—', schema_version: '2.0' } },
    kpis: {
      paradigm_completeness: { label: 'Lemmata mit vollständigem Paradigma', pct: 0, num: 0, den: 0 },
      form_coverage: { label: 'Formen generierbar vs. Wörterbuch', pct: 0, num: 0, den: 0, ortho_pct: 0 },
      corpus_coverage: { label: 'Korpus-Token analysierbar', pct: 0, num: 0, den: 0 }
    },
    health: { generation: { nominal: { cells: 0, matched: 0 }, verbal: { cells: 0, matched: 0 } } },
    pos: [], corpus: { total_tokens: 0, coverage_pct: 0, sources: [], unanalyzable: [] }
  };
}

const STATUS_LABEL = { done: 'fertig', in_progress: 'in Arbeit', open: 'offen', planned: 'geplant' };
const num = n => (n ?? 0).toLocaleString('de-DE');
const ring = (pct, col) => `conic-gradient(${col} ${pct}%, #e3e7ec 0)`;
const covColor = pct => pct >= 80 ? '#2f7d5b' : (pct >= 50 ? '#b6802f' : '#9aa7b2');

function render() {
  const d = (window.DASHBOARD_DATA) || demoData();
  const m = d.meta, k = d.kpis, h = d.health, c = d.corpus;

  const kpis = [
    { eyebrow: 'Paradigmen', o: k.paradigm_completeness, detail: `${num(k.paradigm_completeness.num)} / ${num(k.paradigm_completeness.den)} Lemmata`, col: '#1d4e74' },
    { eyebrow: 'Formen', o: k.form_coverage, detail: `${num(k.form_coverage.num)} / ${num(k.form_coverage.den)} Formen`, col: '#1d4e74' },
    { eyebrow: 'Korpus', o: k.corpus_coverage, detail: `${num(k.corpus_coverage.num)} / ${num(k.corpus_coverage.den)} Token`, col: '#2f7d5b' },
  ];

  const kpiCards = kpis.map(x => `
    <div style="background:#fff;border:1px solid #dde2e8;border-radius:4px;padding:22px 24px 20px;display:flex;gap:20px;align-items:center;">
      <div style="width:92px;height:92px;border-radius:50%;flex:none;background:${ring(x.o.pct, x.col)};display:flex;align-items:center;justify-content:center;">
        <div style="width:70px;height:70px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <span style="font-size:23px;font-weight:600;line-height:1;letter-spacing:-0.02em;">${x.o.pct}<span style="font-size:12px;color:#93a1ad;">%</span></span>
        </div>
      </div>
      <div style="min-width:0;">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;color:#1d4e74;font-weight:600;text-transform:uppercase;margin-bottom:6px;">${x.eyebrow}</div>
        <div style="font-size:14.5px;font-weight:600;line-height:1.25;margin-bottom:7px;">${x.o.label}</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5b6b7a;">${x.detail}</div>
      </div>
    </div>`).join('');

  const posRows = (d.pos || []).map(r => {
    const cov = Math.round(r.form_coverage_pct);
    const col = covColor(r.form_coverage_pct);
    return `
    <div style="display:grid;grid-template-columns:132px 1fr 64px 96px 96px;gap:0 14px;align-items:center;padding:11px 0;border-bottom:1px solid #f0f3f6;">
      <div>
        <div style="display:flex;align-items:baseline;gap:7px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#1d4e74;">${r.tag}</span>
          <span style="font-size:13.5px;font-weight:600;">${r.name}</span>
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#aab6c0;margin-top:1px;">${r.example}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="flex:1;height:7px;background:#eef1f4;border-radius:4px;overflow:hidden;">
          <div style="height:100%;border-radius:4px;width:${cov}%;background:${col};"></div>
        </div>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:#5b6b7a;width:30px;text-align:right;">${cov}</span>
      </div>
      <div style="text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500;">${num(r.lemmata)}</div>
      <div style="text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5b6b7a;">${r.paradigms_done}/${r.paradigms_total}</div>
      <div style="text-align:right;">
        <span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:${col};">
          <span style="width:7px;height:7px;border-radius:50%;background:${col};"></span>${STATUS_LABEL[r.status] || r.status}
        </span>
      </div>
    </div>`;
  }).join('');

  const posLemmaTotal = (d.pos || []).reduce((s, r) => s + (r.lemmata || 0), 0);
  const find = t => (d.pos || []).find(x => x.tag === t) || {};
  const N = find('+N'), V = find('+V');

  const corpusSources = (c.sources || []).map(s => `
    <div style="padding:9px 0;border-bottom:1px solid #f0f3f6;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
        <span style="font-size:13.5px;font-weight:500;">${s.name}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5b6b7a;"><span style="color:#11202e;font-weight:600;">${s.coverage_pct}%</span> · ${num(s.tokens)} tok${s.dropped_docs ? ` · ${s.dropped_docs} Spam-Docs verworfen` : ''}</span>
      </div>
      <div style="height:8px;background:#eef1f4;border-radius:4px;overflow:hidden;display:flex;">
        <div style="height:100%;width:${s.coverage_pct}%;background:#1d4e74;"></div>
      </div>
    </div>`).join('');

  const unanalyzable = (c.unanalyzable || []).map(u => `
    <div style="flex:1;background:#f4f6f8;border:1px solid #e7ebef;border-radius:3px;padding:11px 12px;">
      <div style="font-size:19px;font-weight:600;letter-spacing:-0.02em;">${u.pct}<span style="font-size:11px;color:#93a1ad;">%</span></div>
      <div style="font-size:11.5px;color:#5b6b7a;margin-top:2px;line-height:1.3;">${u.label}</div>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
  <div style="max-width:1320px;margin:0 auto;">
    <header style="display:flex;justify-content:space-between;align-items:flex-end;gap:32px;padding-bottom:22px;border-bottom:2px solid #11202e;margin-bottom:28px;">
      <div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
          <div style="width:26px;height:26px;border:2px solid #1d4e74;border-radius:50%;position:relative;flex:none;">
            <div style="position:absolute;inset:5px;background:#1d4e74;border-radius:50%;clip-path:polygon(0 0,100% 0,100% 50%,0 50%);"></div>
          </div>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.28em;color:#1d4e74;font-weight:600;">GIELLALT · PYFOMA</span>
        </div>
        <h1 style="font-family:'IBM Plex Serif',serif;font-weight:600;font-size:40px;line-height:1.02;margin:0;letter-spacing:-0.01em;">Prūsiskan <span style="color:#1d4e74;">·</span> FST</h1>
        <p style="margin:8px 0 0;font-size:15px;color:#5b6b7a;max-width:560px;line-height:1.45;">Morphologischer Transduktor fürs Altpreußische — Fortschritt der Implementation gegen den <em>Prūsiskas Wirdeīns</em> (Wörterbuch) und den neoprussischen Korpus.</p>
      </div>
      <div style="text-align:right;flex:none;">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#93a1ad;letter-spacing:0.04em;line-height:1.7;">
          <div>pyfoma · lexd · twol</div>
          <div>snapshot <span style="color:#1d4e74;font-weight:600;">${m.generated}</span></div>
        </div>
      </div>
    </header>

    <div style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
      <div style="background:#fff;border:1px solid #d3d9df;border-radius:4px;padding:10px 16px;font-size:12px;display:flex;align-items:center;gap:8px;">
        <span style="width:8px;height:8px;border-radius:50%;background:#2f7d5b;flex:none;"></span>
        <span><span style="font-weight:600;">${h.generation.nominal.matched}/${h.generation.nominal.cells}</span> nominal Gold-Zellen verifiziert</span>
      </div>
      <div style="background:#fff;border:1px solid #d3d9df;border-radius:4px;padding:10px 16px;font-size:12px;display:flex;align-items:center;gap:8px;">
        <span style="width:8px;height:8px;border-radius:50%;background:#2f7d5b;flex:none;"></span>
        <span><span style="font-weight:600;">${h.generation.verbal.matched}/${h.generation.verbal.cells}</span> verbal Gold-Zellen verifiziert</span>
      </div>
    </div>

    <section style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px;">${kpiCards}</section>

    <section style="display:grid;grid-template-columns:1.62fr 1fr;gap:18px;margin-bottom:18px;">
      <div style="background:#fff;border:1px solid #dde2e8;border-radius:4px;padding:24px 26px 10px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
          <h2 style="font-family:'IBM Plex Serif',serif;font-size:19px;font-weight:600;margin:0;">Wortarten — grammatika frā tūres</h2>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#93a1ad;">${num(posLemmaTotal)} Lemmata</span>
        </div>
        <p style="margin:0 0 14px;font-size:12.5px;color:#93a1ad;">Implementierte Kategorien, GiellaLT-Tagset · Form-Abdeckung je Klasse.</p>
        <div style="display:grid;grid-template-columns:132px 1fr 64px 96px 96px;gap:0 14px;align-items:center;padding:0 0 8px;border-bottom:1px solid #eaeef2;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:#93a1ad;text-transform:uppercase;">
          <div>Kategorie</div><div>Form-Abdeckung</div><div style="text-align:right;">Lemmata</div><div style="text-align:right;">Klassen</div><div style="text-align:right;">Status</div>
        </div>
        ${posRows}
      </div>

      <div style="background:#fff;border:1px solid #dde2e8;border-radius:4px;padding:24px 26px;">
        <h2 style="font-family:'IBM Plex Serif',serif;font-size:19px;font-weight:600;margin:0 0 4px;">Paradigmenklassen</h2>
        <p style="margin:0 0 18px;font-size:12.5px;color:#93a1ad;">Nominal (P9–P70) & Verbal (P71–P144).</p>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#1d4e74;font-weight:600;text-transform:uppercase;">Nominal — Deklination</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#93a1ad;">${N.paradigms_done || 0}/${N.paradigms_total || 0}</span>
        </div>
        <div style="height:8px;background:#eef1f4;border-radius:4px;overflow:hidden;margin-bottom:18px;">
          <div style="height:100%;width:${N.paradigms_total ? Math.round(100 * N.paradigms_done / N.paradigms_total) : 0}%;background:#2f7d5b;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#1d4e74;font-weight:600;text-transform:uppercase;">Verbal — Konjugation</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#93a1ad;">${V.paradigms_done || 0}/${V.paradigms_total || 0}</span>
        </div>
        <div style="height:8px;background:#eef1f4;border-radius:4px;overflow:hidden;">
          <div style="height:100%;width:${V.paradigms_total ? Math.round(100 * V.paradigms_done / V.paradigms_total) : 0}%;background:#2f7d5b;"></div>
        </div>
        <div style="display:flex;gap:16px;margin-top:16px;padding-top:13px;border-top:1px solid #eaeef2;font-size:10.5px;color:#93a1ad;">
          <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;border-radius:50%;background:#2f7d5b;"></span>fertig</span>
          <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;border-radius:50%;background:#b6802f;"></span>in Arbeit</span>
          <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;border-radius:50%;background:#9aa7b2;"></span>offen</span>
        </div>
      </div>
    </section>

    <section style="display:grid;grid-template-columns:1.62fr 1fr;gap:18px;">
      <div style="background:#fff;border:1px solid #dde2e8;border-radius:4px;padding:24px 26px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
          <h2 style="font-family:'IBM Plex Serif',serif;font-size:19px;font-weight:600;margin:0;">Korpus-Analysierbarkeit</h2>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#93a1ad;">${num(c.total_tokens)} Token · ${c.coverage_pct}% analysierbar</span>
        </div>
        <p style="margin:0 0 16px;font-size:12.5px;color:#93a1ad;">Anteil der vom FST erkannten Token je Quelle des neoprussischen Korpus.</p>
        ${corpusSources}
        <div style="margin-top:16px;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#93a1ad;font-weight:600;text-transform:uppercase;margin-bottom:10px;">Nicht analysierbar — Gründe</div>
          <div style="display:flex;gap:8px;">${unanalyzable}</div>
        </div>
      </div>

      <div style="background:#11202e;border:1px solid #11202e;border-radius:4px;padding:24px 26px;color:#d7dee5;">
        <h2 style="font-family:'IBM Plex Serif',serif;font-size:19px;font-weight:600;margin:0 0 4px;color:#fff;">Analyzer</h2>
        <p style="margin:0 0 16px;font-size:12.5px;color:#8b9aa8;">pyfoma-lookup gegen den aktuellen Transduktor.</p>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6fb1e3;margin-bottom:4px;">$ echo "wīrs ast labs" | pyfoma</div>
        <div style="background:#0a141d;border-radius:3px;padding:13px 15px;margin-bottom:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;">
          <div style="display:flex;gap:10px;align-items:baseline;padding:3px 0;"><span style="color:#e7c46b;width:64px;flex:none;">wīrs</span><span style="color:#57606b;">→</span><span style="color:#cfd8e0;">wīrs<span style="color:#6fb1e3;">+N+Msc+Sg+Nom</span></span></div>
          <div style="display:flex;gap:10px;align-items:baseline;padding:3px 0;"><span style="color:#e7c46b;width:64px;flex:none;">ast</span><span style="color:#57606b;">→</span><span style="color:#cfd8e0;">būtwei<span style="color:#6fb1e3;">+V+Prs+3</span></span></div>
          <div style="display:flex;gap:10px;align-items:baseline;padding:3px 0;"><span style="color:#e7c46b;width:64px;flex:none;">labs</span><span style="color:#57606b;">→</span><span style="color:#cfd8e0;">labs<span style="color:#6fb1e3;">+A+Pos+Msc+Sg+Nom</span></span></div>
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#6b7a88;font-weight:600;text-transform:uppercase;margin-bottom:10px;">FST-States</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div style="background:#1d2c39;border-radius:3px;padding:10px 12px;"><div style="font-size:10px;color:#6b7a88;margin-bottom:4px;">analyser.fst</div><div style="font-size:15px;font-weight:600;color:#cfd8e0;">${num(m.fst.analyser_states)}</div></div>
          <div style="background:#1d2c39;border-radius:3px;padding:10px 12px;"><div style="font-size:10px;color:#6b7a88;margin-bottom:4px;">lenient.fst</div><div style="font-size:15px;font-weight:600;color:#cfd8e0;">${num(m.fst.lenient_states)}</div></div>
        </div>
      </div>
    </section>

    <footer style="margin-top:24px;padding-top:14px;border-top:1px solid #d3d9df;display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:11px;color:#93a1ad;">
      <span>Lemmata &amp; Paradigmen: <em>Prūsiskas Wirdeīns</em> · Tagset nach GiellaLT · Build ${m.fst.build_commit}.</span>
      <span style="font-family:'IBM Plex Mono',monospace;">dashboard.json v${m.fst.schema_version || (m.schema_version || '')}</span>
    </footer>
  </div>`;
}

render();
</script>
</body>
</html>
